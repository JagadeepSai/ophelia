<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <link rel="icon" href="data:,">
  <title>Not found · X-S20</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14110e; color: #eee6da; font: 16px/1.5 system-ui, sans-serif; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a id="home" href="/">Back to the recipes</a></p>
  </main>
  <script>
    // GitHub Pages serves this page at any depth, so relative links can't be used.
    const project = location.hostname.endsWith(".github.io") ? location.pathname.split("/")[1] : "";
    document.getElementById("home").href = project ? `/${project}/` : "/";
  </script>
</body>
</html>
